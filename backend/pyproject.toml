[project]
name = "is-it-open"
version = "0.1.0"
description = ""
authors = [
    {name = "Brandon Lamer-Connolly",email = "brandon.lc.1334@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "django (<6.0)",
    "django-ninja (>=1.5.3,<2.0.0)",
    "gunicorn (>=25.1.0,<26.0.0)",
    "uvicorn[standard] (>=0.34.0,<0.35.0)",
    "whitenoise>=6.9.0,<7.0.0",
    "python-decouple (>=3.8,<4.0)",
    "requests",
    "django-cors-headers",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "google-cloud-firestore>=2.33.0,<3.0.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-rerunfailures>=16.7",
    "ruff>=0.17.1",
]
# Only for the one-shot legacy import (`manage.py import_postgres`, see README_DEPLOY.md).
# Not installed by default: use `uv sync --group postgres-import` or `uv run --group postgres-import`.
postgres-import = [
    "psycopg[binary] (>=3.3.2,<4.0.0)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config", "services"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py", "tests_*.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers"
markers = [
    "quarantine: known-flaky test; skipped by the required CI job and run in the nightly workflow",
]

[tool.coverage.run]
source = ["apps", "config", "services"]
branch = true
omit = [
    "*/management/commands/import_postgres.py",
    "config/asgi.py",
    "config/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["staticfiles"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DJ"]
# Ternaries aren't always clearer than a short if/else.
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures assign throwaway values and use long literal payloads.
"tests/**" = ["E501"]
