name: widgetbook_workspace
description: "Widgetbook catalog for the Is It Open? Flutter app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # The app under catalog. Use cases import its widgets directly.
  frontend:
    path: ../

  calendar_view: ^2.0.0
  clock: ^1.1.2
  flutter_bloc: ^8.1.3
  latlong2: ^0.9.0
  shared_preferences: ^2.5.5
  timezone: ^0.9.4
  widgetbook: ^3.23.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  google_fonts: ^8.1.0
  build_runner: ^2.13.1
  widgetbook_generator: ^3.23.0

flutter:
  uses-material-design: true

  # Montserrat and Open Sans, so the catalog and the golden tests render the
  # app's fonts offline. See tool/fetch_fonts.sh.
  assets:
    - assets/google_fonts/
