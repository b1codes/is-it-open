services:
  # Local Google Cloud Firestore (emulator + UI at http://localhost:4000)
  firestore:
    build: ./docker/firestore-emulator
    volumes:
      - firestore_data:/data
    environment:
      - FIRESTORE_PROJECT_ID=demo-is-it-open
    ports:
      - "8080:8080"
      - "4000:4000"
      - "9150:9150"
    # Give the emulator time to export its data to the volume on shutdown
    stop_signal: SIGINT
    stop_grace_period: 30s

  # The Django Backend
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/code
    ports:
      - "8001:8000"
    depends_on:
      firestore:
        condition: service_healthy
    environment:
      - DEBUG=1
      - GOOGLE_CLOUD_PROJECT=demo-is-it-open
      - FIRESTORE_EMULATOR_HOST=firestore:8080

volumes:
  firestore_data:
