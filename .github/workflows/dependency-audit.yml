name: Dependency audit

# Known vulnerabilities in the dependencies: pip-audit for the backend's locked packages (PyPI's
# advisories), and osv-scanner for those, the Flutter app's and Widgetbook's pub packages, and the
# Firestore rules tests' npm packages. The pubspec.lock files aren't committed, so this resolves them
# as the Flutter jobs do. Called by ci.yml when the dependencies change (so a PR can't add a
# vulnerable version) and by nightly.yml (for advisories published since). See "Security" in TESTING.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - name: Audit
        # Every dependency group, since the dev tools run in CI too. Hashes pin exactly what's locked.
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          status=0
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip \
            --progress-spinner off --desc --format markdown -o "$RUNNER_TEMP/pip-audit.md" || status=$?
          # pip-audit only writes the report when it finds something.
          { echo "## pip-audit (backend)"; echo; cat "$RUNNER_TEMP/pip-audit.md" 2>/dev/null || echo "No known vulnerabilities found."; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  osv-scanner:
    name: osv-scanner (all lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve the pub packages
        run: |
          (cd frontend && flutter pub get)
          (cd frontend/widgetbook && flutter pub get)

      - name: Scan
        run: |
          status=0
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/google/osv-scanner:v2.6.0 scan source --verbosity error \
            -L frontend/pubspec.lock -L frontend/widgetbook/pubspec.lock -L backend/uv.lock \
            -L docker/firestore-emulator/rules-test/package-lock.json \
            --format markdown > "$RUNNER_TEMP/osv.md" || status=$?
          { echo "## osv-scanner"; echo; cat "$RUNNER_TEMP/osv.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
