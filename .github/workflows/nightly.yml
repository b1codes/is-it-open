name: Nightly

# Slow or non-blocking checks: quarantined (known-flaky) tests, long property-test and API fuzzing
# runs, the live TomTom contract check, the E2E journeys on mobile, mutation testing, the dependency
# audit, and a DAST scan of the API.
# Results land in each run's summary and artifacts; nothing here blocks a merge.
on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-backend:
    name: Quarantined backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GOOGLE_CLOUD_PROJECT: demo-is-it-open
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Start Firestore emulator
        working-directory: .
        run: docker compose up -d --wait firestore
      - name: Test
        run: |
          # Exit code 5 means no test is quarantined.
          uv run pytest -p no:cacheprovider -m quarantine --junitxml=test-results/junit.xml || [ $? -eq 5 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: backend/test-results/
          if-no-files-found: ignore

  property-backend:
    name: Backend property tests (many examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'
      SECRET_KEY: ci-only-not-secret
      HYPOTHESIS_PROFILE: nightly  # random examples, far more than the per-PR run
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Test
        # A failure prints @reproduce_failure(...) for the falsifying example; add it to the test to replay it.
        run: uv run pytest -p no:cacheprovider tests/property --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend-property
          path: backend/test-results/
          if-no-files-found: ignore

  api-fuzz:
    name: API contract fuzzing (many examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GOOGLE_CLOUD_PROJECT: demo-is-it-open
      SECRET_KEY: ci-only-not-secret
      HYPOTHESIS_PROFILE: nightly  # random requests, unlike the fixed set each PR sends
      SCHEMATHESIS_MAX_EXAMPLES: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Start Firestore emulator
        working-directory: .
        run: docker compose up -d --wait firestore
      - name: Test
        # A failure prints a curl command that reproduces it.
        run: uv run pytest -p no:cacheprovider tests/contracts/test_provider.py --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend-api-fuzz
          path: backend/test-results/
          if-no-files-found: ignore

  tomtom-contract:
    name: TomTom live contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'
      SECRET_KEY: ci-only-not-secret
      TOMTOM_LIVE_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Test
        # Checks TomTom's real responses still have the shape in contracts/tomtom/ that the client
        # and the recorded fixtures assume. A failure means TomTom changed its API (or the key
        # stopped working); re-record the fixtures as contracts/README.md describes.
        run: |
          if [ -z "$TOMTOM_LIVE_API_KEY" ]; then
            echo "::warning::Add a TOMTOM_API_KEY repository secret to check the live TomTom API."
            exit 0
          fi
          uv run pytest -p no:cacheprovider tests/contracts/test_tomtom_contract.py -k live --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend-tomtom
          path: backend/test-results/
          if-no-files-found: ignore

  quarantine-frontend:
    name: Quarantined frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Test
        run: |
          mkdir -p test-results
          # Exit code 79 means no test is quarantined.
          flutter test -t quarantine --file-reporter json:test-results/flutter.json || [ $? -eq 79 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-frontend
          path: frontend/test-results/
          if-no-files-found: ignore

  # The E2E journeys on an iOS simulator and an Android emulator (see e2e/README.md).
  e2e-mobile:
    name: E2E on mobile
    uses: ./.github/workflows/e2e-mobile.yml

  # Advisories published since the lockfiles last changed (ci.yml runs the audit when they do).
  dependency-audit:
    name: Dependency audit
    uses: ./.github/workflows/dependency-audit.yml

  # OWASP ZAP's API scan, driven by the OpenAPI schema and signed in as the seeded account. There's no
  # staging backend yet, so it scans the E2E stack: the production image, with TomTom and the iCal
  # feed stubbed. Any alert not accepted in .zap/rules.tsv fails the job.
  dast:
    name: DAST (OWASP ZAP API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait

      - name: Sign in
        run: |
          token=$(curl -fsS -X POST http://localhost:18000/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username": "e2e-seeded", "password": "e2e-password"}' | jq -er .token)
          echo "::add-mask::$token"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"
          echo "ZAP_AUTH_HEADER_SITE=localhost" >> "$GITHUB_ENV"

      - name: Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:18000/api/openapi.json
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > e2e-logs.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dast-stack-logs
          path: e2e-logs.txt
          if-no-files-found: ignore

  mutation-backend:
    name: Backend mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GOOGLE_CLOUD_PROJECT: demo-is-it-open
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Start Firestore emulator
        working-directory: .
        run: docker compose up -d --wait firestore
      - name: Run mutmut
        run: uv run mutmut run --max-children 4
      - name: Summary
        if: always()
        run: |
          uv run mutmut export-cicd-stats
          {
            echo "## Backend mutation testing"
            echo
            echo "Surviving mutants are code changes no test noticed. Inspect one with \`uv run mutmut show <name>\`."
            echo
            echo '```json'
            cat mutants/mutmut-cicd-stats.json
            echo '```'
            echo
            echo '<details><summary>Surviving mutants</summary>'
            echo
            echo '```'
            uv run mutmut results 2>/dev/null | grep -v ': killed' || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-backend
          path: backend/mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore

  mutation-frontend:
    name: Frontend mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Collect coverage
        # Lets mutation_test skip lines no test executes (they're reported as uncovered instead).
        run: flutter test --coverage
      - name: Run mutation_test
        run: |
          dart pub global activate mutation_test 1.8.0
          dart pub global run mutation_test --exclude-strings -c coverage/lcov.info -f md -o mutation-test-report mutation_test.xml
      - name: Summary
        if: always()
        run: |
          { echo "## Frontend mutation testing"; echo; cat mutation-test-report/*.md 2>/dev/null || echo "No report produced."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-frontend
          path: frontend/mutation-test-report/
          if-no-files-found: ignore
