name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

# Minimum total line coverage. Raise these as the backend/frontend suites grow; never lower them.
env:
  BACKEND_MIN_COVERAGE: '95'
  FRONTEND_MIN_COVERAGE: '95'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - 'contracts/**'
            backend:
              - *shared
              - 'backend/**'
              - 'docker/**'
              - 'docker-compose.yml'
              - 'e2e/stub/**'
            frontend:
              - *shared
              - 'frontend/**'
            contracts:
              - 'contracts/**'
            e2e:
              - *shared
              - 'backend/**'
              - 'frontend/**'
              - 'docker/**'
              - 'e2e/**'
              - 'docker-compose.e2e.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: '3.11'  # matches the Dockerfile base image
      FIRESTORE_EMULATOR_HOST: localhost:8080
      GOOGLE_CLOUD_PROJECT: demo-is-it-open
      SECRET_KEY: ci-only-not-secret
      HYPOTHESIS_PROFILE: ci  # fixed property-test examples, so a PR can't fail on a newly drawn one
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover compares against the base branch

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        # ../e2e is the E2E stub server, linted with the backend's settings.
        run: |
          uv run ruff check --output-format=github . ../e2e
          uv run ruff format --check . ../e2e

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Start Firestore emulator
        working-directory: .
        run: docker compose up -d --wait firestore

      - name: Test
        run: >
          uv run pytest -p no:cacheprovider
          -m "not quarantine" --reruns 1
          --cov --cov-report=xml --cov-report=term
          --cov-fail-under="$BACKEND_MIN_COVERAGE"
          --junitxml=test-results/junit.xml

      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            { echo "## Backend coverage (minimum ${BACKEND_MIN_COVERAGE}%)"; echo; uv run coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diff coverage (informational)
        if: github.event_name == 'pull_request'
        run: |
          uvx diff-cover==10.6.0 coverage.xml --compare-branch="origin/${{ github.base_ref }}" --format markdown:diff-cover.md
          { echo "## Backend diff coverage"; echo; cat diff-cover.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build production image
        run: docker build -t is-it-open-backend .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-backend
          path: |
            backend/test-results/
            backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # A zone with DST, so date and time code is tested across clock changes. The suite also
      # passes in UTC.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver

      - name: Analyze
        # Scoped so the nested widgetbook/ package (analyzed in its own job) isn't picked up without its deps.
        run: flutter analyze lib test tool integration_test test_driver

      - name: Test
        run: |
          # Retry a failing test once in CI only; locally a flaky test fails on its first try.
          echo "retry: 1" >> dart_test.yaml
          dart run tool/coverage.dart imports
          mkdir -p test-results
          flutter test --coverage -x quarantine --file-reporter json:test-results/flutter.json

      - name: Coverage gate
        run: dart run tool/coverage.dart check --min="$FRONTEND_MIN_COVERAGE"

      - name: Diff coverage (informational)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          sed 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info > lcov.repo.info
          pipx run diff-cover==10.6.0 lcov.repo.info --compare-branch="origin/${{ github.base_ref }}" --format markdown:diff-cover.md
          { echo "## Frontend diff coverage"; echo; cat diff-cover.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-frontend
          path: |
            frontend/test-results/
            frontend/coverage/lcov.info
          if-no-files-found: ignore

  widgetbook:
    name: Widgetbook
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/widgetbook
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated catalog is current
        run: |
          dart run build_runner build --force-jit
          git diff --exit-code -- lib/main.directories.g.dart || { echo "::error::main.directories.g.dart is stale; run 'dart run build_runner build' in frontend/widgetbook and commit the result."; exit 1; }

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          mkdir -p test-results
          flutter test -x quarantine --file-reporter json:test-results/flutter.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-widgetbook
          path: frontend/widgetbook/test-results/
          if-no-files-found: ignore

  # The Flutter app in headless Chrome against the production backend image, the Firestore
  # emulator and a stub for every external service (docker-compose.e2e.yml). See e2e/README.md.
  e2e:
    name: E2E (${{ matrix.layout }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: desktop
            size: 1600x1024
          - layout: phone
            size: 390x844
    steps:
      - uses: actions/checkout@v4

      - name: Start the E2E stack
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run the journeys
        env:
          E2E_BROWSER_SIZE: ${{ matrix.size }}
        # The runner image ships Chrome with a matching chromedriver in $CHROMEWEBDRIVER.
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" e2e/run-web.sh

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color > e2e-stack.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-${{ matrix.layout }}
          path: |
            frontend/build/e2e-screenshots/
            frontend/build/chromedriver.log
            e2e-stack.log
          if-no-files-found: ignore

  # Released app builds keep calling the API after a deploy, so a PR may not break the contract
  # (contracts/openapi.json) that main's build relies on. See contracts/README.md.
  api-breaking-changes:
    name: API breaking changes
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF: docker run --rm -v ${{ github.workspace }}:/repo -w /repo tufin/oasdiff:v1.33.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the base branch's contract
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:contracts/openapi.json" > base-openapi.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ github.base_ref }} has no contracts/openapi.json yet; nothing to compare against."
          fi

      - name: Changelog
        if: steps.base.outputs.exists == 'true'
        run: |
          { echo "## API changes"; echo; $OASDIFF changelog base-openapi.json contracts/openapi.json -f markdown; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on breaking changes
        if: steps.base.outputs.exists == 'true'
        run: >
          $OASDIFF breaking base-openapi.json contracts/openapi.json
          --fail-on ERR --format githubactions
          --err-ignore contracts/breaking-changes-ignore.txt

  # Branch protection requires a check named "ci". It passes when every job above passed or was
  # skipped because its paths didn't change.
  ci:
    name: ci
    needs: [changes, backend, frontend, widgetbook, e2e, api-breaking-changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
