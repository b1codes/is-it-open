name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Backend Environment
        run: |
          cd backend
          cp sample.env .env

      - name: Build and Run Backend Tests
        run: |
          docker compose up -d --wait firestore
          docker compose build backend
          docker compose run --rm backend python manage.py test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Frontend Tests
        run: |
          cd frontend
          flutter test

      - name: Verify Widgetbook Catalog
        run: |
          cd frontend/widgetbook
          flutter pub get
          dart run build_runner build --force-jit
          git diff --exit-code -- lib/main.directories.g.dart || { echo "::error::main.directories.g.dart is stale; run 'dart run build_runner build' in frontend/widgetbook and commit the result."; exit 1; }
          flutter analyze
          flutter test
