version: '3.8'

services:
  # The Django Backend (data lives in Google Cloud Firestore)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    # command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4 # Already in Dockerfile CMD
    ports:
      - "8000:8000"
    volumes:
      # Service account key with the "Cloud Datastore User" role
      - ${GCP_CREDENTIALS_FILE:-./backend/gcp-service-account.json}:/secrets/gcp-service-account.json:ro
    environment:
      - DEBUG=0
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-service-account.json
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - TOMTOM_API_KEY=${TOMTOM_API_KEY}
